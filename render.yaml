services:
  - type: web
    name: rifapay-api
    runtime: python
    rootDir: server
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: rifapay-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: MP_MOCK_MODE
        value: "False"
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_REDIRECT_URI
        value: "https://rifapay-api.onrender.com/api/mp/callback"
      - key: FRONTEND_URL
        value: "https://rifapay-client.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
  - type: web
    name: rifapay-client
    runtime: static
    rootDir: client
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://rifapay-api.onrender.com"

databases:
  - name: rifapay-db
    plan: free

services:
  - type: web
    name: rifapay-api
    runtime: python
    rootDir: server
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false  # Supabase pooler URI (servicios manuales, sin Blueprint)
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: MP_MOCK_MODE
        value: "False"
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_REDIRECT_URI
        value: "https://rifapay-qa-pv5f.onrender.com/api/mp/callback"
      - key: FRONTEND_URL
        value: "https://rifapay-client.onrender.com"
  - type: web
    name: rifapay-client
    runtime: static
    rootDir: client
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://rifapay-qa-pv5f.onrender.com"

# NOTA: deploy actual con servicios manuales (sin Blueprint, sin tarjeta):
# - rifapay-qa (Web Service Python, root server) + Supabase rifapay-qa como DB.
# - rifapay-client (Static Site, root client).
# La seccion databases de abajo solo aplica si se usa Blueprint con tarjeta.
